name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: check:structure (no file over 800 lines, no import cycles)
        run: npm run check:structure

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Headless only - never spawn a visible browser in CI. Excludes the small set of specs that
      # deliberately open a real --non-headless window (see src/ARCHITECTURE.md / CLI-STOMP-GUARD.md)
      # and are meant for a human to watch locally, not a headless runner.
      - name: Playwright specs (headless)
        env:
          WAYGRAPH_HEADED: "0"
        run: npx playwright test --grep-invert "non-headless"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7

  saucedemo-example:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install waygraph dependencies
        run: npm ci

      - name: Build waygraph
        run: npm run build

      - name: Install saucedemo example dependencies
        run: npm run example:saucedemo:install

      - name: Install Playwright browsers
        run: npx --prefix examples/saucedemo playwright install --with-deps chromium

      - name: "List flows (smoke: discovery actually works against the built package)"
        run: node bin/waygraph list examples/saucedemo
