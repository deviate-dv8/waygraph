name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The specs scan examples/saucedemo and examples/routed-demo, which import "waygraph": link this build in.
      - name: Link the examples to this build
        run: npm run examples:link

      - name: Typecheck
        run: npm run typecheck

      - name: check:structure (layers, no cycles, file sizes, HTML sinks, env registry, catch-alls, any ratchet)
        run: npm run check:structure

      - name: knip (unused files, exports and dependencies)
        run: npm run knip

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Headless runs, minus the specs tagged non-headless (meant for a human to watch locally). A few
      # specs check that `browser start` / `pilot start` open a visible browser by default; xvfb gives
      # them a virtual screen (installed by playwright install --with-deps).
      - name: Playwright specs (headless)
        env:
          WAYGRAPH_HEADED: "0"
        run: xvfb-run -a npx playwright test --grep-invert "non-headless"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7

  saucedemo-example:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install waygraph dependencies
        run: npm ci

      - name: Build waygraph
        run: npm run build

      - name: Install saucedemo example dependencies
        run: npm run example:saucedemo:install

      - name: Install Playwright browsers
        run: npx --prefix examples/saucedemo playwright install --with-deps chromium

      - name: "List flows (smoke: discovery actually works against the built package)"
        run: node bin/waygraph list examples/saucedemo
